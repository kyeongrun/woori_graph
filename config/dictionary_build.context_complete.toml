[run]
dictionary_version = "v4-context-complete-20260821"

[paths]
# 모든 상대경로는 이 TOML 파일 위치를 기준으로 해석한다.
source = "../data/raw"
artifact_root = "../artifacts/dictionary-build"
context_prompt = "../prompts/context_resolve.ko.md"
raw_svo_prompt = "../prompts/raw_svo_extract_context_complete.ko.md"
env_file = "../.env"

[execution]
# 각 semantic unit은 독립 요청이며 동시에 최대 32개 요청을 처리한다.
context_workers = 32
svo_workers = 32
batch_size = 200

[relations]
max_types = 100
polarity_strategy = "separate_canonical_types"

[storage]
postgres_schema = "graph_v2"
age_graph = "svo_v2"
opensearch_entity_alias = "entities_v2"
opensearch_relation_alias = "relations_v2"
