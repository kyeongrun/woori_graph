[paths]
# All relative paths are resolved from this TOML file's directory.
artifact_root = "../artifacts/search"
env_file = "../.env"

[services]
opensearch_url = "http://127.0.0.1:19200"
entity_index = "entities"
relation_index = "relations"
postgres_dsn_env = "GRAPH_POSTGRES_DSN"
# For authenticated OpenSearch, set both names and put their values in .env.
# opensearch_username_env = "OPENSEARCH_USERNAME"
# opensearch_password_env = "OPENSEARCH_PASSWORD"
verify_tls = true

[search]
max_hops = 3
entity_top_k = 8
relation_top_k = 20
max_neighbors_per_entity = 50
path_beam_width = 160
max_paths = 50
evidence_per_relation = 3
timeout_seconds = 180
request_timeout_seconds = 30
