name: graph-local

services:
  age:
    image: apache/age:release_PG16_1.6.0
    container_name: graphdb
    environment:
      POSTGRES_USER: woori
      POSTGRES_DB: graphdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../../runtime/postgres:/var/lib/postgresql/data
      - ../../runtime:/runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woori -d graphdb"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: graph-search
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "127.0.0.1:19200:9200"
      - "127.0.0.1:19600:9600"
    volumes:
      - ../../runtime/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
