[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "woori-graph"
version = "0.1.0"
description = "Document-grounded SVO graph construction for regulations and internal rules."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.0,<3",
]

[project.scripts]
woori-graph = "woori_graph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
